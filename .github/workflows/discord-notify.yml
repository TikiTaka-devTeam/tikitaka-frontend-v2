name: Discord Notification

on:
  pull_request:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord PR opened
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          CONTENT=$(printf '🔔[FRONTEND] PR이 생성되었습니다.\nRepository: %s\nTitle: %s\nAuthor: %s\nBranch: %s → %s\nURL: %s' \
            "$REPOSITORY" "$PR_TITLE" "$PR_AUTHOR" "$PR_HEAD" "$PR_BASE" "$PR_URL")

          jq -n --arg content "$CONTENT" '{content: $content}' |
            curl --fail-with-body \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$DISCORD_WEBHOOK_URL"
