name: Frontend Deploy to S3 and CloudFlare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create production env file
        run: |
          {
            echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}"
          } > .env.production

          grep -q '^VITE_API_BASE_URL=.' .env.production
          grep -q '^VITE_FIREBASE_VAPID_KEY=.' .env.production

      - name: Build
        run: pnpm build
