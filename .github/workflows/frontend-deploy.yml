name: Frontend Deploy to S3 and CloudFlare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create production env file
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          {
            echo "VITE_API_BASE_URL=${VITE_API_BASE_URL}"
          } > .env.production

          grep -q '^VITE_API_BASE_URL=.' .env.production

      - name: Build
        run: pnpm build

  notify:
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord deploy success
        if: ${{ needs.deploy.result == 'success' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          CONTENT=$(printf '✅[FRONTEND] 배포 성공\nRepository: %s\nBranch: %s\nURL: 차후 배포 예정' \
            "$REPOSITORY" "$BRANCH")

          jq -n --arg content "$CONTENT" '{content: $content}' |
            curl --fail-with-body \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord deploy failure
        if: ${{ needs.deploy.result == 'failure' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CONTENT=$(printf '❌[FRONTEND] 배포 실패\nRepository: %s\nBranch: %s\nActions: %s' \
            "$REPOSITORY" "$BRANCH" "$ACTIONS_URL")

          jq -n --arg content "$CONTENT" '{content: $content}' |
            curl --fail-with-body \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$DISCORD_WEBHOOK_URL"
